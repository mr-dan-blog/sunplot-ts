<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Sunplot</title>
</head>

<body>
    <h1>Sunplot</h1>
    <canvas id="canvas" height="288" width="365"></canvas>
    <fieldset>
        <legend>Astronomy</legend>
        Coordinates
        <br>
        <input name="latitude" id="lat" type="text" value="42.4" pattern="-?\d?\d(\.\d+)?" inputmode="decimal" required style="width: 74px;" />
        <label for="lat">°N</label>

        <input name="longitude" id="lon" type="text" value="71" pattern="-?1?\d?\d(\.\d+)?" inputmode="decimal" required style="width: 74px;" />
        <label for="lon">°W</label>
        <br>
        <label for="start_time">Start time: </label>
        <input type="datetime-local" id="start_time" value="2026-01-01T00:00" required> (UTC)
        <br>
        <input name="utc" id="utc" type="checkbox">
        <label for="utc">Use UTC (off: local solar time)</label>
    </fieldset>
    <fieldset>
        <legend>Color</legend>
        <label for="model">Color model: </label>
        <select name="model" id="model">
            <option>Okhsl</option>
            <option>Okhsv</option>
            <option>HSL</option>
        </select>
        <br>
        <label for="black">Black floor: </label>
        <input name="black" id="black" type="number" value="0.0" min="0.0" max="0.5" step="0.01" inputmode="decimal" required />
        <br>
        <label for="night_max">Maximum nighttime brightness: </label>
        <input name="night_max" id="night_max" type="number" value="0.40" min="0.00" max="1.00" step="0.05" inputmode="decimal" required />
        <br>
        <label for="day_min">Minimum daytime brightness: </label>
        <input name="day_min" id="day_min" type="number" value="0.60" min="0.00" max="1.00" step="0.05" inputmode="decimal" required />
        <br>
        <label for="gap">Day-night transition width: </label>
        <input name="gap" id="gap" type="number" value="0.05" min="0.00" max="1.00" step="0.01" inputmode="decimal" required />
        <br>
        <label for="white">White ceiling: </label>
        <input name="white" id="white" type="number" value="0.95" min="0.5" max="1.00" step="0.01" inputmode="decimal" required />
        <br>
        <label for="hue_shift">Hue shift: </label>
        <input name="hue_shift" id="hue_shift" type="number" value="120" min="0" max="360" step="15" inputmode="numeric" required />
        <input name="mirror_hue" id="mirror_hue" type="checkbox">
        <label for="mirror_hue">Mirror</label>
        <br>
        <!-- <input id="draw" type="submit" value="Draw"> -->
    </fieldset>
</body>

</html>
