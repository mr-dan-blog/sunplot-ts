<!doctype html><html><head><meta charset="utf-8"/><title>Sunplot</title><script defer="defer" src="main.js"></script></head><body><h1>Sunplot</h1><canvas id="canvas" height="288" width="365"></canvas><fieldset><legend>Astronomy</legend>Coordinates<br><input name="latitude" id="lat" value="42.4" pattern="-?\d?\d(\.\d+)?" inputmode="decimal" required/> <label for="lat">°N</label> <input name="longitude" id="lon" value="71" pattern="-?1?\d?\d(\.\d+)?" inputmode="decimal" required/> <label for="lon">°W</label><br><label for="start-time">Start time:</label> <input type="datetime-local" id="start-time" required> (UTC)<br><input id="calculate" type="submit" value="Calculate"></fieldset><fieldset><legend>Color</legend><label for="model">Color model:</label> <select name="model" id="model"><option>Okhsl</option><option>Oklch</option><option>HSLuv</option><option>HSL</option></select><br><label for="h_1">Maximum nighttime brightness:</label> <input name="h_1" id="h_1" type="number" value="0.30" min="0.00" max="1.00" step="0.05" inputmode="decimal" required/><br><label for="h_2">Minimum daytime brightness:</label> <input name="h_2" id="h_2" type="number" value="0.70" min="0.00" max="1.00" step="0.05" inputmode="decimal" required/><br><label for="gap">Day-night transition width:</label> <input name="gap" id="gap" type="number" value="0.05" min="0.00" max="1.00" step="0.01" inputmode="decimal" required/><br><label for="white">White ceiling:</label> <input name="white" id="white" type="number" value="0.75" min="0.5" max="1.00" step="0.01" inputmode="decimal" required/><br><label for="hue">Hue shift:</label> <input name="hue" id="hue" type="number" value="0" min="-360" max="360" step="15" inputmode="numeric" required/> <label for="mirror_hue">Mirror</label> <input name="mirror_hue" id="mirror_hue" type="checkbox"><br><input id="draw" type="submit" value="Draw"></fieldset></body></html>
