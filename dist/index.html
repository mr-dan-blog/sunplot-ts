<!doctype html><html><head><meta charset="utf-8"/><title>Sunplot</title><script defer="defer" src="main.js"></script></head><body><h1>Sunplot</h1><canvas id="canvas" height="288" width="365"></canvas><fieldset><legend>Astronomy</legend>Coordinates<br><input name="latitude" id="lat" value="42.4" pattern="-?\d?\d(\.\d+)?" inputmode="decimal" required/> <label for="lat">°N</label> <input name="longitude" id="lon" value="71" pattern="-?1?\d?\d(\.\d+)?" inputmode="decimal" required/> <label for="lon">°W</label><br><label for="start-time">Start time:</label> <input type="datetime-local" id="start-time" value="2026-01-01T04:44" required> (UTC)<br></fieldset><fieldset><legend>Color</legend><label for="model">Color model:</label> <select name="model" id="model"><option>Okhsl</option><option>HSL</option></select><br><label for="black">Black floor:</label> <input name="black" id="black" type="number" value="0.0" min="0.0" max="0.5" step="0.01" inputmode="decimal" required/><br><label for="h_1">Maximum nighttime brightness:</label> <input name="h_1" id="h_1" type="range" value="0.40" min="0.00" max="1.00" step="0.05" inputmode="decimal" required/><br><label for="h_2">Minimum daytime brightness:</label> <input name="h_2" id="h_2" type="range" value="0.60" min="0.00" max="1.00" step="0.05" inputmode="decimal" required/><br><label for="gap">Day-night transition width:</label> <input name="gap" id="gap" type="number" value="0.05" min="0.00" max="1.00" step="0.01" inputmode="decimal" required/><br><label for="white">White ceiling:</label> <input name="white" id="white" type="number" value="0.95" min="0.5" max="1.00" step="0.01" inputmode="decimal" required/><br><label for="hue">Hue shift:</label> <input name="hue" id="hue" type="number" value="120" min="0" max="360" step="15" inputmode="numeric" required/> <label for="mirror_hue">Mirror</label> <input name="mirror_hue" id="mirror_hue" type="checkbox"><br></fieldset></body></html>
